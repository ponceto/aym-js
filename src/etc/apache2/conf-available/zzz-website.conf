# ----------------------------------------------------------------------------
# LogFormat
# ----------------------------------------------------------------------------

LogFormat "%v:%p %a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" vhost_combined
LogFormat "%a %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" combined
LogFormat "%a %l %u %t \"%r\" %>s %O" common
LogFormat "%{Referer}i -> %U" referer
LogFormat "%{User-agent}i" agent

# ----------------------------------------------------------------------------
# ErrorDocument
# ----------------------------------------------------------------------------

ErrorDocument 403 /403.html
ErrorDocument 404 /404.html

# ----------------------------------------------------------------------------
# ServerTokens
# ----------------------------------------------------------------------------

ServerTokens Prod

# ----------------------------------------------------------------------------
# mpm_event
# ----------------------------------------------------------------------------

<IfModule event.c>
ServerLimit              8
StartServers             3
MinSpareThreads          75
MaxSpareThreads          250
ThreadLimit              64
ThreadsPerChild          64
MaxRequestWorkers        512
MaxConnectionsPerChild   0
AsyncRequestWorkerFactor 3
</IfModule>

# ----------------------------------------------------------------------------
# mpm_prefork
# ----------------------------------------------------------------------------

<IfModule prefork.c>
ServerLimit             512
StartServers            5
MinSpareServers         5
MaxSpareServers         10
MaxRequestWorkers       512
MaxConnectionsPerChild  0
</IfModule>

# ----------------------------------------------------------------------------
# mod_ssl
# ----------------------------------------------------------------------------

<IfModule mod_ssl.c>
</IfModule>

# ----------------------------------------------------------------------------
# mod_expires
# ----------------------------------------------------------------------------

<IfModule mod_expires.c>
ExpiresActive On
ExpiresDefault                          "access plus 1 week"
# dynamic - never cached
ExpiresByType text/html                 "access plus 0 seconds"
ExpiresByType application/json          "access plus 0 seconds"
ExpiresByType application/ld+json       "access plus 0 seconds"
ExpiresByType application/xml           "access plus 0 seconds"
ExpiresByType text/xml                  "access plus 0 seconds"
ExpiresByType text/cache-manifest       "access plus 0 seconds"
ExpiresByType application/manifest+json "access plus 1 week"
# css / js - short (no fingerprinting = staleness on every deploy)
ExpiresByType text/css                  "access plus 1 day"
ExpiresByType text/javascript           "access plus 1 day"
ExpiresByType application/javascript    "access plus 1 day"
# images - replaceable without url change
ExpiresByType image/jpeg                "access plus 1 week"
ExpiresByType image/png                 "access plus 1 week"
ExpiresByType image/gif                 "access plus 1 week"
ExpiresByType image/webp                "access plus 1 week"
ExpiresByType image/avif                "access plus 1 week"
ExpiresByType image/svg+xml             "access plus 1 week"
ExpiresByType image/x-icon              "access plus 1 week"
# fonts - near-immutable
ExpiresByType font/woff2                "access plus 1 month"
ExpiresByType font/woff                 "access plus 1 month"
ExpiresByType font/ttf                  "access plus 1 month"
ExpiresByType font/otf                  "access plus 1 month"
# heavy media and game payloads (wasm, raw data)
ExpiresByType application/wasm          "access plus 1 month"
ExpiresByType application/octet-stream  "access plus 1 month"
ExpiresByType audio/ogg                 "access plus 1 month"
ExpiresByType video/mp4                 "access plus 1 month"
ExpiresByType video/webm                "access plus 1 month"
</IfModule>

# ----------------------------------------------------------------------------
# mod_headers
# ----------------------------------------------------------------------------

<IfModule mod_headers.c>
# security headers
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
# dynamic documents - always revalidated (304 when unchanged)
<FilesMatch "\.(?:html|xml|json|txt)$">
	Header set Cache-Control "no-cache"
</FilesMatch>
# fingerprinted bundles - immutable for one year
<FilesMatch "\.[0-9a-f]{64}\.(?:css|js)$">
	Header set Cache-Control "public, max-age=31536000, immutable"
</FilesMatch>
# vendored assets - long-lived
<Directory /var/www/html/public/vendor>
	Header set Cache-Control "public, max-age=2592000"
</Directory>
</IfModule>

# ----------------------------------------------------------------------------
# mod_deflate
# ----------------------------------------------------------------------------

<IfModule mod_deflate.c>
# game payloads served as application/octet-stream (e.g. Emscripten .data)
AddOutputFilterByType DEFLATE application/octet-stream
</IfModule>

# ----------------------------------------------------------------------------
# mod_remoteip
# ----------------------------------------------------------------------------

<IfModule mod_remoteip.c>
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy 127.0.0.1
RemoteIPInternalProxy 10.0.0.0/8
RemoteIPInternalProxy 172.16.0.0/12
RemoteIPInternalProxy 192.168.0.0/16
</IfModule>

# ----------------------------------------------------------------------------
# Directory /var/www/html/public
# ----------------------------------------------------------------------------

<Directory /var/www/html/public>
	Options -Indexes +FollowSymLinks
	AllowOverride all
</Directory>

# ----------------------------------------------------------------------------
# Directory /var/www/html/private
# ----------------------------------------------------------------------------

<Directory /var/www/html/private>
	Options -Indexes +FollowSymLinks
	AllowOverride all
	Require ip 127.0.0.1
	Require ip 10.0.0.0/8
	Require ip 172.16.0.0/12
	Require ip 192.168.0.0/16
	Require ip ::1
	Require ip fd00::/8
</Directory>

# ----------------------------------------------------------------------------
# End-Of-File
# ----------------------------------------------------------------------------
