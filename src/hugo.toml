baseURL = 'https://aym-js.emaxilde.net/'
theme = 'aym-js'
locale = 'en-US'
defaultContentLanguage = 'en'
title = 'AYM·JS'
uglyurls = true
enableRobotsTXT = true
pagination.pagerSize = 10

[[menus.main]]
name   = 'Home'
url    = '/'
weight = 10

[[menus.main]]
name   = 'Player'
url    = '/player.html'
weight = 20

[[menus.main]]
name   = 'Synth'
url    = '/synth.html'
weight = 30

[[menus.main]]
name   = 'Code'
url    = '/code.html'
weight = 40

[[menus.main]]
name   = 'License'
url    = '/license.html'
weight = 50

[[menus.main]]
name   = 'About'
url    = '/about.html'
weight = 60

[params]
charset     = 'utf-8'
viewport    = 'width=device-width, initial-scale=1.0'
description = 'AYM·JS is a sound chip emulator written in JavaScript and designed to emulate the AY-3-8910 PSG (Programmable Sound Generator) and the YM2149 SSG (Software-Controlled Sound Generator).'
keywords    = 'AY-3-8910, AY-3-8912, AY-3-8913, YM2149, Programmable Sound Generator, Software-Controlled Sound Generator, Emulator, JavaScript'
author      = 'Olivier Poncet'
copyright   = 'Copyright © 2001-2026'
images      = ['assets/images/banner.jpg']
imageAlt    = 'AYM·JS — A sound chip emulator written in JavaScript'
imageWidth  = 1500
imageHeight = 500
colophon    = 'Made with ❤️ <br>AYM·JS, an AY-3-8910 / YM2149 sound chip emulator running in your web browser.'

[params.home]
heroKicker = 'AY-3-8910 PSG / YM2149 SSG'
heroTitle  = 'AYM·JS'
heroRole   = 'Sound chip emulator'
heroLede   = 'A sound chip emulator written in plain <strong>JavaScript</strong> and <strong>Web Audio</strong>, designed to emulate the venerable <strong>AY-3-8910</strong> and <strong>YM2149</strong> sound chips directly in your web browser.'

[[params.home.heroButtons]]
label = 'Player'
url   = '/player.html'
icon  = 'fa-solid fa-play'

[[params.home.heroButtons]]
label = 'Synth'
url   = '/synth.html'
icon  = 'fa-solid fa-music'

[[params.home.heroButtons]]
